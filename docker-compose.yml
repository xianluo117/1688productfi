services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_manager}
      POSTGRES_USER: ${POSTGRES_USER:-product_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-product_manager} -d ${POSTGRES_DB:-product_manager}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-qingmiaoai/1688productfitt:backend}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-product_manager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-product_manager}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Legacy global ingest tokens are intentionally unsupported after the multi-user upgrade.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://s.1688.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      IMAGE_STORAGE_PATH: /data/images
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - image_data:/data/images
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:-qingmiaoai/1688productfitt:frontend}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-1788}:80'

volumes:
  postgres_data:
  image_data:
